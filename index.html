<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ========================================== -->
    <!--      تنظیمات جلوگیری از کَش (NO-CACHE)     -->
    <!-- ========================================== -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <!-- ========================================== -->

    <title>سامانه برنامه‌ریزی درسی</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
    <!-- افزودن Google Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #090712;
            background-image: 
                radial-gradient(circle at top left, #2e1065 0%, transparent 40%), 
                radial-gradient(circle at bottom right, #1e1b4b 0%, transparent 40%);
            color: #fff;
            scroll-behavior: smooth;
            min-height: 100vh;
        }
        body::-webkit-scrollbar { display: none; }
        body { -ms-overflow-style: none; scrollbar-width: none; }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .custom-header {
            background: rgba(139, 92, 246, 0.1);
            backdrop-filter: blur(25px);
            border-bottom: 1px solid rgba(167, 139, 250, 0.2);
            border-bottom-left-radius: 3rem;
            border-bottom-right-radius: 3rem;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .header-shrunk {
            padding-top: 1rem !important;
            padding-bottom: 1rem !important;
            border-bottom-left-radius: 1.5rem;
            border-bottom-right-radius: 1.5rem;
            background: rgba(9, 7, 18, 0.85);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }
        .header-content { transition: all 0.3s ease; }
        .header-shrunk .header-content {
            opacity: 0; height: 0; margin-bottom: 0 !important;
            pointer-events: none; transform: translateY(-10px);
        }
        .course-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(167, 139, 250, 0.15);
            border-radius: 2.5rem;
            transition: all 0.3s ease;
        }
        .course-card:hover {
            transform: translateY(-5px);
            background: rgba(139, 92, 246, 0.05);
            border-color: rgba(167, 139, 250, 0.4);
        }
        .spinner {
            border: 3px solid rgba(167, 139, 250, 0.1);
            width: 32px; height: 32px; border-radius: 50%;
            border-left-color: #a78bfa;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #copyToast {
            position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%);
            background: rgba(124, 58, 237, 0.9);
            backdrop-filter: blur(15px); color: white;
            padding: 14px 28px; border-radius: 25px;
            font-size: 13px; font-weight: bold;
            display: flex; align-items: center; gap: 10px;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000; box-shadow: 0 15px 35px rgba(124, 58, 237, 0.3);
        }
        #copyToast.show { bottom: 40px; }
    </style>
</head>
<body class="pb-10">

    <div id="copyToast">
        <span class="material-symbols-outlined text-green-300">check_circle</span>
        <span>کد ارائه درس با موفقیت کپی شد</span>
    </div>

    <header id="mainHeader" class="custom-header text-white pt-8 pb-10 px-6 shadow-xl sticky top-0 z-50">
        <div class="max-w-md mx-auto">
            <div class="header-content flex justify-between items-center mb-4">
                <div>
                    <h1 class="text-xl font-black tracking-tight">دستیار؛ سامانه هوشمند کمک‌رسان</h1>
                    <p class="text-indigo-300 text-[10px] mt-1 font-medium leading-relaxed">
    دستانتان را آزاد نگه دارید.<br>بازوی هوشمند واحد الکترونیکی دانشگاه آزاد اسلامی اینجاست!</p>
                </div>
                <div class="bg-indigo-500/20 p-2.5 rounded-2xl border border-indigo-400/30 text-indigo-300 flex items-center justify-center">
                    <span class="material-symbols-outlined text-xl">menu_book</span>
                </div>
            </div>

            <div class="relative group">
                <input type="text" id="searchInput" oninput="handleSearch()" 
                       placeholder="نام درس، استاد یا کد..." 
                       class="w-full bg-white/5 text-white py-4 px-6 pr-12 rounded-[22px] border border-white/10 backdrop-blur-md focus:outline-none focus:ring-2 focus:ring-purple-500/50 transition-all text-sm font-medium">
                <div class="absolute right-4 top-1/2 -translate-y-1/2 text-purple-400 flex items-center">
                    <span class="material-symbols-outlined text-xl">search</span>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 mt-6 relative z-10">
        <div id="loading" class="bg-white/5 backdrop-blur-xl rounded-[2.5rem] p-12 text-center border border-white/10 shadow-2xl">
            <div class="spinner mx-auto mb-6"></div>
            <h2 class="text-purple-300 font-bold text-sm">در حال دریافت هوشمند اطلاعات...</h2>
        </div>

        <div id="courseList" class="space-y-5 hidden"></div>

        <div id="statusMessage" class="hidden text-center py-16 bg-white/5 rounded-[3rem] border-2 border-dashed border-white/10">
            <div class="flex justify-center mb-3">
                <span class="material-symbols-outlined text-5xl text-purple-400/40">search_off</span>
            </div>
            <h3 id="statusText" class="text-white font-bold text-sm">موردی یافت نشد</h3>
            <button onclick="clearSearch()" class="mt-4 text-purple-400 text-xs font-black underline">نمایش همه دروس</button>
        </div>
    </main>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby6NxXcr-cGYJDK0aRZAmOCecttG4cUw9MfQ8y2ET2WS9Xbt90JXTBb9QzG5ix33iKnyg/exec";
        let allData = []; 
        let priorityOrder = [];

        window.onscroll = function() {
            const header = document.getElementById("mainHeader");
            if (document.body.scrollTop > 50 || document.documentElement.scrollTop > 50) { header.classList.add("header-shrunk"); } 
            else { header.classList.remove("header-shrunk"); }
        };

        function formatToPersian(text) {
            if (!text || text === "مشخص نشده") return text || "مشخص نشده";
            const persianDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
            return String(text).replace(/[0-9]/g, (digit) => persianDigits[digit]);
        }

        // موتور استانداردسازی متن برای جستجوی بسیار هوشمند
        function normalizeText(str) {
            if (!str) return "";
            return String(str)
                .toLowerCase()
                // تبدیل تمام اعداد به انگلیسی
                .replace(/[۰-۹]/g, d => d.charCodeAt(0) - 1776)
                .replace(/[٠-٩]/g, d => d.charCodeAt(0) - 1632)
                // یکسان‌سازی حروف فارسی/عربی
                .replace(/ي/g, "ی")
                .replace(/ك/g, "ک")
                .replace(/آ|أ|إ/g, "ا")
                .replace(/ۀ|ة/g, "ه")
                // حذف تمام علائم نگارشی، پرانتزها، خط تیره‌ها و نقاط
                .replace(/[()\[\]{}_\-.,:;!؟]/g, " ")
                // یکسان‌سازی فضاهای خالی
                .replace(/\s+/g, " ")
                .trim();
        }

        function copyCode(code) {
            if (code === "مشخص نشده") return;
            const el = document.createElement('textarea'); el.value = code; document.body.appendChild(el);
            el.select(); document.execCommand('copy'); document.body.removeChild(el);
            const toast = document.getElementById('copyToast'); toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetch(SCRIPT_URL + "?v=" + new Date().getTime())
                .then(res => res.json())
                .then(data => handleDataResponse(data))
                .catch(err => handleServerError(err));
        });

        function handleDataResponse(response) {
            const rows = response.data || []; 
            priorityOrder = (response.priorityList || []).map(p => normalizeText(p)).filter(Boolean);

            allData = rows.map(row => ({
                "نام درس": (row[0] && String(row[0]).trim()) ? row[0] : "بدون نام",
                "واحد": (row[1] && String(row[1]).trim()) ? row[1] : "۰",
                "کد ارائه": (row[2] && String(row[2]).trim()) ? row[2] : "مشخص نشده",
                "روز": (row[3] && String(row[3]).trim()) ? row[3] : "مشخص نشده",
                "زمان": (row[4] && String(row[4]).trim()) ? row[4] : "مشخص نشده",
                "استاد": (row[5] && String(row[5]).trim()) ? row[5] : "مشخص نشده",
                "تاریخ امتحان": (row[6] && String(row[6]).trim()) ? row[6] : "مشخص نشده",
                "ساعت امتحان": (row[7] && String(row[7]).trim()) ? row[7] : "مشخص نشده"
            }));

            renderList(sortData(allData));
            document.getElementById('loading').classList.add('hidden');
        }

        function handleServerError(err) {
            console.error("Server Error:", err);
            document.getElementById('loading').classList.add('hidden');
            const statusDiv = document.getElementById('statusMessage');
            const statusText = document.getElementById('statusText');
            statusDiv.classList.remove('hidden');
            if (statusText) statusText.innerText = "خطا در دریافت اطلاعات از سرور";
        }

        // مرتب‌سازی بر اساس اولویت + حروف الفبا (بدون حذف داده)
        function sortData(list) {
            if (!list) return [];
            return list.slice().sort((a, b) => {
                const nameA = normalizeText(a['نام درس']);
                const nameB = normalizeText(b['نام درس']);

                const isPriorityA = priorityOrder.some(p => nameA.includes(p));
                const isPriorityB = priorityOrder.some(p => nameB.includes(p));

                if (isPriorityA && !isPriorityB) return -1;
                if (!isPriorityA && isPriorityB) return 1;

                return String(a['نام درس']).localeCompare(String(b['نام درس']), 'fa', { sensitivity: 'base' });
            });
        }

        function renderList(items) {
            const container = document.getElementById('courseList');
            const statusDiv = document.getElementById('statusMessage');
            
            if (!items || items.length === 0) { 
                container.classList.add('hidden'); 
                statusDiv.classList.remove('hidden'); 
                return; 
            }
            
            statusDiv.classList.add('hidden'); 
            container.classList.remove('hidden');
            
            container.innerHTML = items.map(course => `
                <div class="course-card p-6 shadow-2xl">
                    <div class="flex justify-between items-start mb-5">
                        <div class="flex-1">
                            <h3 class="text-white font-black text-lg leading-tight">${formatToPersian(course['نام درس'])}</h3>
                            <div class="mt-3 flex items-center gap-2">
                                <span onclick="copyCode('${course['کد ارائه']}')" class="bg-purple-600/20 text-purple-300 text-[10px] font-bold px-3 py-1.5 rounded-xl border border-purple-500/20 cursor-pointer active:scale-95 transition-all">
                                    کد: ${formatToPersian(course['کد ارائه'])}
                                </span>
                                <span class="text-white/40 text-[10px] font-medium">${formatToPersian(course['واحد'])} واحد</span>
                            </div>
                        </div>
                        <div class="bg-gradient-to-br from-purple-600 to-indigo-700 text-white min-w-[75px] py-2 rounded-[20px] flex items-center justify-center shadow-lg px-3">
                            <span class="text-[12px] font-black">${course['روز']}</span>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3 text-xs mb-5">
                        <div class="flex items-center gap-2.5 bg-white/5 p-3 rounded-[20px] border border-white/5 min-w-0">
                            <span class="material-symbols-outlined text-purple-300 text-xl shrink-0">person</span>
                            <div class="flex flex-col min-w-0 flex-1">
                                <span class="text-[9px] text-white/40">استاد</span>
                                <span class="font-bold text-white text-[11px] sm:text-xs truncate block" title="${course['استاد']}">${course['استاد']}</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-2.5 bg-white/5 p-3 rounded-[20px] border border-white/5 min-w-0">
                            <span class="material-symbols-outlined text-purple-300 text-xl shrink-0">schedule</span>
                            <div class="flex flex-col min-w-0 flex-1">
                                <span class="text-[9px] text-white/40">زمان</span>
                                <span class="font-bold text-white text-[11px] sm:text-xs truncate block">${formatToPersian(course['زمان'])}</span>
                            </div>
                        </div>
                    </div>
                    <div class="border-t border-white/10 pt-4 flex justify-between items-center">
                        <div class="flex flex-col">
                            <span class="text-[9px] text-purple-400 font-black mb-0.5 uppercase">تاریخ امتحان</span>
                            <span class="text-[11px] font-bold text-white/80">${formatToPersian(course['تاریخ امتحان'])}</span>
                        </div>
                        <div class="bg-white/5 text-white/80 border border-white/10 px-4 py-1.5 rounded-xl text-[11px] font-black">
                            ${formatToPersian(course['ساعت امتحان'])}
                        </div>
                    </div>
                </div>`).join('');
        }

        // جستجوی هوشمند تطبیقی (Token-Based Search)
        function handleSearch() {
            const rawQuery = document.getElementById('searchInput').value;
            const normalizedQuery = normalizeText(rawQuery);
            
            if (!normalizedQuery) {
                renderList(sortData(allData));
                return;
            }

            // جدا کردن کلمات ورودی کاربر
            const queryTokens = normalizedQuery.split(" ").filter(Boolean);

            const filtered = allData.filter(course => {
                // ساخت متن قابل جستجو برای هر کارت
                const searchableText = normalizeText(
                    (course['نام درس'] || "") + " " + 
                    (course['استاد'] || "") + " " + 
                    (course['کد ارائه'] || "")
                );

                // شرط: تمام کلمات وارد شده توسط کاربر باید در متن کارت موجود باشند
                return queryTokens.every(token => searchableText.includes(token));
            });

            renderList(sortData(filtered));
        }

        function clearSearch() { 
            document.getElementById('searchInput').value = ""; 
            renderList(sortData(allData)); 
        }
    </script>
</body>
</html>
